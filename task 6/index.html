<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Secret Number</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-box" id="gameBox">
    <h1>Find the Secret Number</h1>
    <p>Guess a number from 1 to 10</p>

    <input type="number" id="guessInput" placeholder="Your guess">

    <div class="buttons">
      <button id="checkButton">Check</button>
      <button id="resetButton">Reset</button>
    </div>

    <p id="message">Good luck</p>
    <p>Attempts: <span id="attempts">5</span></p>

    <button id="helpButton">How to Play</button>
  </div>

  


  <script src="app.js"></script>
</body>
</html>
